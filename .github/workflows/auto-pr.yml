name: Auto-Create Pull Request

on:
  push:
    branches-ignore:
      - master

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq 'length')
          
          if [ "$EXISTING_PR" -eq 0 ]; then
            gh pr create --base master --head "$BRANCH_NAME" --title "Auto-PR from teammate's $BRANCH_NAME" --body "Automated pull request from teammate's fork push."
          else
            echo "Pull request already exists for $BRANCH_NAME"
          fi
        shell: bash
